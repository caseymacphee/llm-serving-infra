apiVersion: v1
kind: Secret
metadata:
  name: llm-gateway-secrets
  labels:
    app.kubernetes.io/part-of: llm-gateway
type: Opaque
stringData:
  LITELLM_MASTER_KEY: {{ required "secrets.litellmMasterKey is required (use -f values-secrets.yaml)" .Values.secrets.litellmMasterKey | quote }}
  MOONSHOT_API_KEY: {{ .Values.secrets.moonshotApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  LANGFUSE_PUBLIC_KEY: {{ .Values.secrets.langfusePublicKey | quote }}
  LANGFUSE_SECRET_KEY: {{ .Values.secrets.langfuseSecretKey | quote }}
